<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realtime Story Chat</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 900px;
        margin: 0 auto;
        padding: 24px;
        background: #f7f7f8;
      }

      h1 {
        margin-bottom: 8px;
      }

      .controls {
        display: flex;
        gap: 12px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }

      button {
        padding: 10px 16px;
        font-size: 15px;
        cursor: pointer;
      }

      #status {
        margin-bottom: 16px;
        font-size: 14px;
      }

      #chat {
        background: white;
        border: 1px solid #ddd;
        border-radius: 12px;
        min-height: 420px;
        max-height: 420px;
        overflow-y: auto;
        padding: 16px;
        margin-bottom: 16px;
      }

      .msg {
        margin-bottom: 14px;
        padding: 10px 12px;
        border-radius: 10px;
        white-space: pre-wrap;
        line-height: 1.4;
      }

      .user {
        background: #e8f0fe;
      }

      .assistant {
        background: #f1f3f4;
      }

      .system {
        background: #fff8e1;
      }

      .label {
        font-weight: bold;
        margin-bottom: 4px;
      }

      .input-row {
        display: flex;
        gap: 12px;
      }

      #textInput {
        flex: 1;
        padding: 12px;
        font-size: 15px;
      }

      #debug {
        margin-top: 16px;
        background: #111;
        color: #ddd;
        padding: 12px;
        border-radius: 10px;
        max-height: 180px;
        overflow-y: auto;
        font-size: 12px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Realtime Story Chat</h1>
    <p>Click Start first. Then type messages like a chatbot.</p>

    <div class="controls">
      <button id="startBtn">Start</button>
      <button id="muteBtn" disabled>Mute audio</button>
    </div>

    <div id="status">Status: not connected</div>

    <div id="chat"></div>

    <div class="input-row">
      <input
        id="textInput"
        type="text"
        placeholder="Type your message..."
        disabled
      />
      <button id="sendBtn" disabled>Send</button>
    </div>

    <div id="debug"></div>

    <script>
      const startBtn = document.getElementById("startBtn");
      const muteBtn = document.getElementById("muteBtn");
      const sendBtn = document.getElementById("sendBtn");
      const textInput = document.getElementById("textInput");
      const chat = document.getElementById("chat");
      const statusEl = document.getElementById("status");
      const debugEl = document.getElementById("debug");

      let pc = null;
      let dc = null;
      let audioEl = null;
      let localStream = null;
      let isMuted = false;

      let currentAssistantDiv = null;
      let currentAssistantText = "";

      function setStatus(text) {
        statusEl.textContent = `Status: ${text}`;
      }

      function logDebug(text) {
        debugEl.textContent += text + "\n";
        debugEl.scrollTop = debugEl.scrollHeight;
      }

      function addMessage(role, text) {
        const wrapper = document.createElement("div");
        wrapper.className = `msg ${role}`;

        const label = document.createElement("div");
        label.className = "label";
        label.textContent =
          role === "user"
            ? "You"
            : role === "assistant"
            ? "Assistant"
            : "System";

        const body = document.createElement("div");
        body.textContent = text;

        wrapper.appendChild(label);
        wrapper.appendChild(body);
        chat.appendChild(wrapper);
        chat.scrollTop = chat.scrollHeight;

        return body;
      }

      async function startSession() {
        try {
          setStatus("connecting...");
          logDebug("Creating RTCPeerConnection");
          startBtn.disabled = true;

          pc = new RTCPeerConnection();

          audioEl = document.createElement("audio");
          audioEl.autoplay = true;

          pc.ontrack = (event) => {
            audioEl.srcObject = event.streams[0];
            logDebug("Remote audio connected");
          };

          dc = pc.createDataChannel("oai-events");

          dc.onopen = () => {
            setStatus("connected");
            sendBtn.disabled = false;
            textInput.disabled = false;
            muteBtn.disabled = false;
            logDebug("Data channel open");
          };

          dc.onclose = () => {
            setStatus("disconnected");
            logDebug("Data channel closed");
          };

          dc.onerror = (error) => {
            logDebug("Data channel error: " + error.message);
          };

          dc.onmessage = (event) => {
            try {
              const data = JSON.parse(event.data);
              logDebug(JSON.stringify(data));

              if (data.type === "response.created") {
                currentAssistantDiv = addMessage("assistant", "");
                currentAssistantText = "";
              }

              if (
                data.type === "response.output_text.delta" &&
                typeof data.delta === "string"
              ) {
                if (!currentAssistantDiv) {
                  currentAssistantDiv = addMessage("assistant", "");
                  currentAssistantText = "";
                }

                currentAssistantText += data.delta;
                currentAssistantDiv.textContent = currentAssistantText;
                chat.scrollTop = chat.scrollHeight;
              }

              if (data.type === "response.output_text.done") {
                currentAssistantDiv = null;
                currentAssistantText = "";
              }

              if (data.type === "error") {
                addMessage("system", `Error: ${JSON.stringify(data.error)}`);
              }
            } catch (err) {
              logDebug("Non-JSON event: " + event.data);
            }
          };

          localStream = await navigator.mediaDevices.getUserMedia({
            audio: true
          });

          const [track] = localStream.getAudioTracks();
          pc.addTrack(track, localStream);

          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);

          logDebug("Sending SDP offer to local server");
          const response = await fetch("/session", {
            method: "POST",
            headers: {
              "Content-Type": "application/sdp"
            },
            body: offer.sdp
          });

          const answerSdp = await response.text();

          if (!response.ok) {
            throw new Error(answerSdp);
          }

          await pc.setRemoteDescription({
            type: "answer",
            sdp: answerSdp
          });

          setStatus("connected");
          addMessage(
            "system",
            "Connected. You can now type messages and chat continuously."
          );
        } catch (error) {
          console.error(error);
          setStatus("failed");
          addMessage("system", `Connection failed: ${error.message}`);
          startBtn.disabled = false;
        }
      }

      function sendTextMessage() {
        const text = textInput.value.trim();

        if (!text) return;

        if (!dc || dc.readyState !== "open") {
          addMessage("system", "Not connected yet.");
          return;
        }

        addMessage("user", text);

        dc.send(
          JSON.stringify({
            type: "conversation.item.create",
            item: {
              type: "message",
              role: "user",
              content: [
                {
                  type: "input_text",
                  text
                }
              ]
            }
          })
        );

        dc.send(
          JSON.stringify({
            type: "response.create"
          })
        );

        textInput.value = "";
      }

      startBtn.onclick = startSession;

      sendBtn.onclick = sendTextMessage;

      textInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          sendTextMessage();
        }
      });

      muteBtn.onclick = () => {
        if (!audioEl) return;

        isMuted = !isMuted;
        audioEl.muted = isMuted;
        muteBtn.textContent = isMuted ? "Unmute audio" : "Mute audio";
      };
    </script>
  </body>
</html>
