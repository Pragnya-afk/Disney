<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Olaf Story — Time-Constrained Director</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
      body { font-family: Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 24px; background: #f7f7f8; }
      .controls { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
      button { padding: 10px 16px; font-size: 15px; cursor: pointer; }
      #status { margin-bottom: 8px; font-size: 14px; }
      #timerPanel { background: white; border: 1px solid #ddd; border-radius: 10px; padding: 12px 16px; margin-bottom: 12px; display: none; }
      #timerPanel.active { display: block; }
      .timer-row { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; flex-wrap: wrap; }
      #timerDisplay { font-size: 22px; font-weight: bold; font-variant-numeric: tabular-nums; min-width: 90px; }
      #timerLabel { font-size: 13px; color: #555; }
      #pacingBadge { padding: 4px 10px; border-radius: 20px; font-size: 13px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; background: #c8e6c9; color: #1b5e20; }
      #pacingBadge.too_fast  { background: #bbdefb; color: #0d47a1; }
      #pacingBadge.normal    { background: #c8e6c9; color: #1b5e20; }
      #pacingBadge.hurry     { background: #ffe0b2; color: #e65100; }
      #pacingBadge.critical  { background: #ffcdd2; color: #b71c1c; }
      #pacingBadge.final     { background: #d32f2f; color: white; }
      .timer-bar-track { background: #e0e0e0; border-radius: 6px; height: 8px; overflow: hidden; }
      #timerBar { height: 100%; border-radius: 6px; background: #66bb6a; transition: width 1s linear, background 0.5s; width: 0%; }
      #timerBar.hurry    { background: #ffa726; }
      #timerBar.critical { background: #ef5350; }
      #timerBar.final    { background: #b71c1c; }
      #beatInfo { font-size: 12px; color: #555; margin-top: 4px; }
      #chat { background: white; border: 1px solid #ddd; border-radius: 12px; min-height: 380px; max-height: 380px; overflow-y: auto; padding: 16px; margin-bottom: 16px; }
      .msg { margin-bottom: 14px; padding: 10px 12px; border-radius: 10px; white-space: pre-wrap; line-height: 1.4; }
      .user      { background: #e8f0fe; }
      .assistant { background: #f1f3f4; }
      .system    { background: #fff8e1; }
      .director  { background: #e8f5e9; font-size: 12px; color: #2e7d32; }
      .director.too_fast  { background: #e3f2fd; color: #0d47a1; }
      .director.hurry     { background: #fff3e0; color: #e65100; }
      .director.critical  { background: #ffebee; color: #c62828; }
      .director.final     { background: #d32f2f; color: white; }
      .label { font-weight: bold; margin-bottom: 4px; }
      .pacing-tag { display: inline-block; font-size: 10px; font-weight: bold; text-transform: uppercase; padding: 1px 6px; border-radius: 10px; margin-left: 6px; background: rgba(0,0,0,0.08); vertical-align: middle; }
      .input-row { display: flex; gap: 12px; }
      #textInput { flex: 1; padding: 12px; font-size: 15px; }
      #debug { margin-top: 16px; background: #111; color: #ddd; padding: 12px; border-radius: 10px; max-height: 160px; overflow-y: auto; font-size: 12px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Realtime Story — Time-Constrained Director</h1>
    <p>The Director Agent guides the story and enforces a target duration. Speak or type — Olaf calls the director before every response and adjusts pacing accordingly.</p>

    <div class="controls">
      <label for="scenarioSelect" style="font-size:14px;">Scenario:</label>
      <select id="scenarioSelect" style="padding:8px;font-size:14px;"></select>

      <label for="timeLimitSelect" style="font-size:14px;margin-left:8px;">Time limit:</label>
      <select id="timeLimitSelect" style="padding:8px;font-size:14px;">
        <option value="1">1 min</option>
        <option value="2">2 min</option>
        <option value="3">3 min</option>
        <option value="5" selected>5 min</option>
        <option value="10">10 min</option>
        <option value="15">15 min</option>
      </select>

      <button id="startBtn">Start</button>
      <button id="muteAudioBtn" disabled>Mute audio</button>
      <button id="muteMicBtn" disabled>Mute microphone</button>
      <button id="stopBtn" disabled>Stop</button>
    </div>

    <div id="status">Status: not connected</div>

    <div id="timerPanel">
      <div class="timer-row">
        <div>
          <div id="timerDisplay">0:00</div>
          <div id="timerLabel">elapsed</div>
        </div>
        <div style="flex:1;">
          <div class="timer-bar-track"><div id="timerBar"></div></div>
          <div id="beatInfo">Beat — / —</div>
        </div>
        <div id="pacingBadge" class="normal">normal</div>
      </div>
    </div>

    <div id="chat"></div>

    <div class="input-row">
      <input id="textInput" type="text" placeholder="Type your message..." disabled />
      <button id="sendBtn" disabled>Send</button>
    </div>

    <div id="debug"></div>

    <script>
      const startBtn        = document.getElementById("startBtn");
      const muteAudioBtn    = document.getElementById("muteAudioBtn");
      const muteMicBtn      = document.getElementById("muteMicBtn");
      const stopBtn         = document.getElementById("stopBtn");
      const sendBtn         = document.getElementById("sendBtn");
      const textInput       = document.getElementById("textInput");
      const chat            = document.getElementById("chat");
      const statusEl        = document.getElementById("status");
      const debugEl         = document.getElementById("debug");
      const scenarioSelect  = document.getElementById("scenarioSelect");
      const timeLimitSelect = document.getElementById("timeLimitSelect");
      const timerPanel      = document.getElementById("timerPanel");
      const timerDisplay    = document.getElementById("timerDisplay");
      const timerLabel      = document.getElementById("timerLabel");
      const timerBar        = document.getElementById("timerBar");
      const beatInfo        = document.getElementById("beatInfo");
      const pacingBadge     = document.getElementById("pacingBadge");

      fetch("/scenarios").then(r => r.json()).then(list => {
        list.forEach(({ key, label }) => {
          const opt = document.createElement("option");
          opt.value = key; opt.textContent = label;
          scenarioSelect.appendChild(opt);
        });
      });

      let socket = null;
      let audioCtx = null;
      let micStream = null, micProcessor = null, micSource = null;
      let nextPlayTime = 0;
      let isAudioMuted = false, isMicMuted = false;
      let timerPollId = null;
      let timeLimitMin = 5;

      let currentAssistantDiv  = null;
      let currentAssistantText = "";

      // ── UI helpers ─────────────────────────────────────────────────────────

      function setStatus(text) { statusEl.textContent = `Status: ${text}`; }

      function logDebug(text) {
        debugEl.textContent += text + "\n";
        debugEl.scrollTop = debugEl.scrollHeight;
      }

      function fmt(seconds) {
        const s = Math.max(0, Math.round(seconds));
        return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
      }

      function addMessage(role, text, pacingMode) {
        const wrapper = document.createElement("div");
        wrapper.className = `msg ${role}`;
        if (role === "director" && pacingMode) wrapper.classList.add(pacingMode);
        const label = document.createElement("div");
        label.className = "label";
        if (role === "user")           label.textContent = "You";
        else if (role === "assistant") label.textContent = "Olaf";
        else if (role === "director") {
          label.innerHTML = "Director";
          if (pacingMode) {
            const tag = document.createElement("span");
            tag.className = "pacing-tag";
            tag.textContent = pacingMode.replace("_", " ");
            label.appendChild(tag);
          }
        }
        else label.textContent = "System";
        const body = document.createElement("div");
        body.textContent = text;
        wrapper.appendChild(label);
        wrapper.appendChild(body);
        chat.appendChild(wrapper);
        chat.scrollTop = chat.scrollHeight;
        return body;
      }

      // ── Timer ──────────────────────────────────────────────────────────────

      function updateTimer(elapsed, remaining, pacing, beatIdx, totalBeats) {
        const limitSecs = timeLimitMin * 60;
        const pct = Math.min(100, (elapsed / limitSecs) * 100);
        timerDisplay.textContent = fmt(elapsed);
        timerLabel.textContent   = `elapsed · ${fmt(remaining)} remaining`;
        timerBar.style.width     = `${pct}%`;
        timerBar.className       = pacing;
        pacingBadge.textContent  = (pacing || "normal").replace("_", " ");
        pacingBadge.className    = pacing || "normal";
        if (beatIdx !== undefined && totalBeats !== undefined) {
          beatInfo.textContent = `Beat ${beatIdx + 1} / ${totalBeats}`;
        }
      }

      function startTimerPoll() {
        timerPanel.classList.add("active");
        timerPollId = setInterval(async () => {
          try {
            const r = await fetch("/time_status");
            const data = await r.json();
            if (data.active) {
              updateTimer(
                data.elapsed_seconds, data.remaining_seconds,
                data.pacing_mode, data.beat_index, data.total_beats
              );
            }
          } catch {}
        }, 2000);
      }

      function stopTimerPoll() {
        clearInterval(timerPollId);
        timerPollId = null;
        timerPanel.classList.remove("active");
      }

      // ── Audio playback ─────────────────────────────────────────────────────

      function playAudioChunk(base64pcm) {
        if (!audioCtx || isAudioMuted) return;
        try {
          const binary = atob(base64pcm);
          const bytes  = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
          const int16   = new Int16Array(bytes.buffer);
          const float32 = new Float32Array(int16.length);
          for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768.0;
          const buf = audioCtx.createBuffer(1, float32.length, 24000);
          buf.copyToChannel(float32, 0);
          const src = audioCtx.createBufferSource();
          src.buffer = buf;
          src.connect(audioCtx.destination);
          const startAt = Math.max(audioCtx.currentTime + 0.02, nextPlayTime);
          src.start(startAt);
          nextPlayTime = startAt + buf.duration;
        } catch (e) {
          logDebug("[playback error] " + e.message);
        }
      }

      // ── Mic capture ────────────────────────────────────────────────────────

      function float32ToBase64Pcm16(float32, fromRate) {
        const toRate = 24000;
        const ratio  = fromRate / toRate;
        const len    = Math.round(float32.length / ratio);
        const down   = new Float32Array(len);
        for (let i = 0; i < len; i++) {
          const s  = i * ratio;
          const lo = Math.floor(s);
          const hi = Math.min(lo + 1, float32.length - 1);
          down[i]  = float32[lo] + (s - lo) * (float32[hi] - float32[lo]);
        }
        const int16 = new Int16Array(down.length);
        for (let i = 0; i < down.length; i++) {
          int16[i] = Math.max(-32768, Math.min(32767, Math.round(down[i] * 32767)));
        }
        const bytes = new Uint8Array(int16.buffer);
        let binary  = "";
        const CHUNK = 8192;
        for (let i = 0; i < bytes.length; i += CHUNK) {
          binary += String.fromCharCode(...bytes.subarray(i, i + CHUNK));
        }
        return btoa(binary);
      }

      async function startMicCapture() {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        micSource = audioCtx.createMediaStreamSource(micStream);
        micProcessor = audioCtx.createScriptProcessor(4096, 1, 1);
        micSource.connect(micProcessor);
        micProcessor.connect(audioCtx.destination);
        const ctxRate = audioCtx.sampleRate;
        micProcessor.onaudioprocess = (e) => {
          if (!socket || isMicMuted) return;
          const float32 = e.inputBuffer.getChannelData(0);
          socket.emit("audio_input", { audio: float32ToBase64Pcm16(float32, ctxRate) });
        };
        logDebug("[mic] capturing at " + ctxRate + "Hz → 24kHz");
      }

      // ── Session setup ──────────────────────────────────────────────────────

      async function startSession() {
        try {
          setStatus("connecting...");
          startBtn.disabled        = true;
          scenarioSelect.disabled  = true;
          timeLimitSelect.disabled = true;

          // Request mic access first — fail fast before opening server connection
          const testStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
          testStream.getTracks().forEach(t => t.stop());

          timeLimitMin = parseFloat(timeLimitSelect.value) || 5;

          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          nextPlayTime = 0;

          socket = io();

          socket.on("connect", () => {
            logDebug("[socket] connected: " + socket.id);
            socket.emit("start_session", {
              scenario:   scenarioSelect.value || "olaf_anna_courtyard",
              time_limit: timeLimitMin,
            });
          });

          socket.on("session_started", (data) => {
            setStatus("ready — speak or type");
            sendBtn.disabled      = false;
            textInput.disabled    = false;
            muteAudioBtn.disabled = false;
            muteMicBtn.disabled   = false;
            stopBtn.disabled      = false;
            addMessage("system", "Connected. Speak or type — Olaf will respond.");
            logDebug("[session] started: " + (data.scenario || "") + " | " + (data.time_limit || timeLimitMin) + " min");
            startTimerPoll();
          });

          socket.on("audio_output", (data) => {
            playAudioChunk(data.audio);
          });

          socket.on("transcript_user", (data) => {
            if (data.text) addMessage("user", data.text);
          });

          socket.on("transcript_assistant", (data) => {
            if (!currentAssistantDiv) {
              currentAssistantDiv  = addMessage("assistant", "");
              currentAssistantText = "";
            }
            currentAssistantText += data.delta || "";
            currentAssistantDiv.textContent = currentAssistantText;
            chat.scrollTop = chat.scrollHeight;
          });

          socket.on("director_decision", (data) => {
            const pacing = data.pacing_mode || "normal";
            addMessage("director", `${data.decision_type}: ${data.instruction}`, pacing);
            logDebug("[director] " + data.decision_type + " | pacing: " + pacing);
            if (data.elapsed_seconds !== undefined) {
              updateTimer(data.elapsed_seconds, data.remaining_seconds, pacing);
            }
          });

          socket.on("response_done", () => {
            currentAssistantDiv  = null;
            currentAssistantText = "";
          });

          socket.on("time_up", () => {
            addMessage("system", "Time's up — Olaf is wrapping up the story...");
            logDebug("[Time's up — story close injected server-side]");
          });

          socket.on("error", (data) => {
            logDebug("[error] " + JSON.stringify(data.message));
            addMessage("system", "Error: " + JSON.stringify(data.message));
          });

          socket.on("disconnect", () => {
            setStatus("disconnected");
            logDebug("[socket] disconnected");
          });

          await startMicCapture();

        } catch (error) {
          console.error(error);
          setStatus("failed");
          addMessage("system", "Connection failed: " + error.message);
          startBtn.disabled        = false;
          scenarioSelect.disabled  = false;
          timeLimitSelect.disabled = false;
        }
      }

      // ── Text input ─────────────────────────────────────────────────────────

      function sendTextMessage() {
        const text = textInput.value.trim();
        if (!text || !socket) return;
        addMessage("user", text);
        textInput.value = "";
        socket.emit("text_input", { text });
      }

      // ── Controls ───────────────────────────────────────────────────────────

      function muteAudio() {
        isAudioMuted = !isAudioMuted;
        muteAudioBtn.textContent = isAudioMuted ? "Unmute audio" : "Mute audio";
      }

      function muteMicrophone() {
        isMicMuted = !isMicMuted;
        muteMicBtn.textContent = isMicMuted ? "Unmute microphone" : "Mute microphone";
        addMessage("system", isMicMuted ? "Microphone muted." : "Microphone unmuted.");
      }

      function stopSession() {
        stopTimerPoll();
        if (micProcessor) { micProcessor.disconnect(); micProcessor = null; }
        if (micSource)    { micSource.disconnect();    micSource    = null; }
        if (micStream)    { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
        if (audioCtx)     { audioCtx.close(); audioCtx = null; }
        if (socket)       { socket.disconnect(); socket = null; }
        nextPlayTime = 0;
        startBtn.disabled        = false;
        sendBtn.disabled         = true;
        textInput.disabled       = true;
        muteAudioBtn.disabled    = true;
        muteMicBtn.disabled      = true;
        stopBtn.disabled         = true;
        scenarioSelect.disabled  = false;
        timeLimitSelect.disabled = false;
        setStatus("stopped");
        addMessage("system", "Session stopped.");
      }

      startBtn.onclick     = startSession;
      sendBtn.onclick      = sendTextMessage;
      muteAudioBtn.onclick = muteAudio;
      muteMicBtn.onclick   = muteMicrophone;
      stopBtn.onclick      = stopSession;
      textInput.addEventListener("keydown", e => { if (e.key === "Enter") sendTextMessage(); });
    </script>
  </body>
</html>
