[project]
name = "controllable-storytelling"
version = "1.0.0"
description = "Bachelor thesis: live user-study app and realtime voice demos for controllable storytelling with a director agent."
requires-python = ">=3.12,<3.13"

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "third_party/"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "W"]
# E402: scripts extend sys.path before local imports by design; E501: long prompt strings are kept verbatim.
ignore = ["E402", "E501"]

